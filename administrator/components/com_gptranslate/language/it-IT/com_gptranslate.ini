COM_GPTRANSLATE_RESPONSIVEVOICE_LANGUAGE_GENDER_FEMALE="Femminile"
COM_GPTRANSLATE_MAINPAGE_SELECTOR="Selettore CSS per il testo principale della pagina"
COM_GPTRANSLATE_MAINPAGE_SELECTOR_DESC="Puoi specificare un selettore CSS per gli elementi HTML della pagina per identificare e leggere il testo principale"
COM_GPTRANSLATE_ELEMENTS_TOEXCLUDE_CUSTOM="Selettore CSS per gli elementi da escludere"
COM_GPTRANSLATE_ELEMENTS_TOEXCLUDE_CUSTOM_DESC="È possibile specificare un selettore CSS per gli elementi HTML che verranno esclusi dalla lettura"
COM_GPTRANSLATE_VOLUME="Volume"
COM_GPTRANSLATE_VOLUME_DESC="Selezionare il volume di lettura di default"
COM_GPTRANSLATE_RESPONSIVEVOICE_VOICE_SPEED="Velocità di lettura"
COM_GPTRANSLATE_RESPONSIVEVOICE_VOICE_SPEED_DESC="Imposta la velocità di lettura audio"
