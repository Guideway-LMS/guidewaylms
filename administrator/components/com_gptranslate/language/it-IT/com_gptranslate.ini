COM_GPTRANSLATE_VOICE_SPEED_NORMAL="Normale"
COM_GPTRANSLATE_VOICE_SPEED_FAST="Veloce"
COM_GPTRANSLATE_VOICE_SPEED_VERYFAST="Molto veloce"
COM_GPTRANSLATE_VOICE_SPEED_EXTREMELYFAST="Estremamente veloce"
COM_GPTRANSLATE_RESPONSIVE_LOADING_SCRIPT="Caricamento script di Responsive Voice"
COM_GPTRANSLATE_RESPONSIVE_LOADING_SCRIPT_DESC="Puoi scegliere di caricare lo script di Responsive Voice dal tuo server locale o dal server remoto ufficiale https://responsivevoice.org"
COM_GPTRANSLATE_RESPONSIVE_LOADING_SCRIPT_LOCAL="Script locale"
COM_GPTRANSLATE_RESPONSIVE_LOADING_SCRIPT_REMOTE="Script remoto"
COM_GPTRANSLATE_CHUNKSIZE="Lunghezza massima del blocco"
COM_GPTRANSLATE_CHUNKSIZE_DESC="Questa è la dimensione del buffer per i caratteri e si applica solamente al caricamento dello script locale. Cambia questo valore solo se riscontri problemi di prestazioni o se la lettura si interrompe in un punto casuale del testo, poiché indica la lunghezza massima del blocco di testo da convertire in audio"


; Appearance
COM_GPTRANSLATE_WIDGET_TEXT_COLOR="Colore del testo"
COM_GPTRANSLATE_WIDGET_TEXT_COLOR_DESC="Scegli il colore del testo del widget"
COM_GPTRANSLATE_WIDGET_BACKGROUND_COLOR="Colore dello sfondo"
COM_GPTRANSLATE_WIDGET_BACKGROUND_COLOR_DESC="Scegli il colore dello sfondo del widget"
COM_GPTRANSLATE_WIDGET_BORDER_RADIUS="Border radius"
COM_GPTRANSLATE_WIDGET_BORDER_RADIUS_DESC="Scegli un border-radius opzionale per il widget"
COM_GPTRANSLATE_WIDGET_POPUP_FONTSIZE="Dimensione caratteri"
COM_GPTRANSLATE_WIDGET_POPUP_FONTSIZE_DESC="Scegli la dimensione dei caratteri preferita per il testo del widget. Questa opzione calcola anche il padding tra le bandierine e può essere utile per gestire la quantità di padding per le bandierine visualizzate senza il nome della lingua e il menu a discesa"
COM_GPTRANSLATE_WIDGET_POPUP_ICONSIZE="Dimensione icone"
COM_GPTRANSLATE_WIDGET_POPUP_ICONSIZE_DESC="Scegli la dimensione preferita delle icone sia per le bandierine che per i pulsanti di riproduzione audio"
COM_GPTRANSLATE_FLAG_STYLE="Stile bandierine"
COM_GPTRANSLATE_FLAG_STYLE_DESC="Scegli lo stile preferito per le bandierine delle lingue"
COM_GPTRANSLATE_FLAG_STYLE_2D="Stile piatto"
COM_GPTRANSLATE_FLAG_STYLE_3D="Stile in rilievo"
COM_GPTRANSLATE_FLAG_LOCATION="Percorso bandierine"
COM_GPTRANSLATE_FLAG_LOCATION_DESC="Scegli il percorso per le bandierine della lingua, locale o CDN remota"
COM_GPTRANSLATE_FLAG_LOCAL="Locale"
COM_GPTRANSLATE_FLAG_CDN="CDN remota"
COM_GPTRANSLATE_SHOW_LANGUAGE_TITLES="Mostra titoli lingua"
COM_GPTRANSLATE_SHOW_LANGUAGE_TITLES_DESC="Scegliere se visualizzare i titoli della lingua o soltanto le bandierine"
COM_GPTRANSLATE_ENABLE_DROPDOWN="Abilita menu a discesa"
COM_GPTRANSLATE_ENABLE_DROPDOWN_DESC="L'elenco delle lingue disponibili verrà visualizzato utilizzando un menu a discesa. Se scegli la visualizzazione inline delle lingue all'interno di un modulo anziché utilizzare un widget, potrebbe essere necessario disabilitare questa opzione"
COM_GPTRANSLATE_EQUAL_WIDTHS="Larghezze analoghe"
COM_GPTRANSLATE_EQUAL_WIDTHS_DESC="Quando l'elenco delle lingue disponibili non viene visualizzato utilizzando un widget, è possibile scegliere di visualizzare la bandierina e il titolo di ciascuna lingua con la stessa larghezza"
COM_GPTRANSLATE_READER_BUTTON_POSITION="Posizione pulsante del lettore"
COM_GPTRANSLATE_READER_BUTTON_POSITION_DESC="Se il menu a discesa della lingua è disabilitato, è possibile scegliere di visualizzare il pulsante del lettore nella parte superiore o inferiore del widget"
COM_GPTRANSLATE_READER_BUTTON_POSITION_TOP="Superiore"
COM_GPTRANSLATE_READER_BUTTON_POSITION_BOTTOM="Inferiore"
COM_GPTRANSLATE_WIDGET_MAX_HEIGHT="Altezza massima del widget"
COM_GPTRANSLATE_WIDGET_MAX_HEIGHT_DESC="Inserisci l'altezza massima del widget in px. Se l'altezza viene superata, verrà visualizzata una barra di scorrimento quando il widget è aperto"

; Joomla Updater
COM_GPTRANSLATE_AUTO_UPDATER="Aggiornamenti automatici"
COM_GPTRANSLATE_REGISTRATION_EMAIL_FORUPDATES="Indirizzo email per gli aggiornamenti"
COM_GPTRANSLATE_REGISTRATION_EMAIL_FORUPDATES_DESC="Inserire esattamente l'indirizzo email utilizzato per registrarsi sul sito https://storejextensions.org. L'indirizzo email viene utilizzato per identificare il tuo account e la validità della licenza degli aggiornamenti. Gli aggiornamenti gratuiti sono compresi per 1 anno dalla data di acquisto. Se la licenza aggiornamenti è valida, sarà possibile aggiornare il plugin tramite la sezioni aggiornamenti di Joomla! Maggiori informazioni su licenze e aggiornamenti sono disponibili alla pagina FAQ: https://storejextensions.org/faq.html"
COM_GPTRANSLATE_UPDATER_STANDARD_ADVISE="Le nostre estensioni commerciali richiedono una licenza valida per essere aggiornati utilizzando la sezione aggiornamenti di Joomla! In alternativa potete scaricare e installare l'ultimo pacchetto utilizzando la Gestione Estensioni di Joomla! Per scaricare l'ultima nuova versione è necessaria una licenza degli aggiornamenti valida, la licenza per aggiornamenti gratuiti è valido per 1 anno dalla data di acquisto. Se la licenza è scaduta, si può semplicemente acquistare di nuovo il prodotto per scaricare l'ultima release ed estendere gli aggiornamenti gratuiti per 1 ulteriore anno. Visita il nostro sito <a target='_ blank' href = 'https://storejextensions.org'>https://storejextensions.org</a> e dopo aver effettuato il login controlla la tua area riservata 'Purchased products'. Maggiori informazioni alla pagina delle FAQ: <a target='_ blank' href= 'https://storejextensions.org/faq.html'>https://storejextensions.org/faq.html</a>"
COM_GPTRANSLATE_MISSING_REGISTRATION_EMAIL_ADDRESS="indirizzo e-mail di registrazione mancante per il programma di aggiornamento. Si prega di specificare nel <a href='%s'>parametro di configurazione del componente</a>, l'indirizzo email esatto utilizzato per registrare il tuo account sul nostro sito <a target='_blank' href='https://storejextensions.org'> </a>. l'indirizzo email viene utilizzato per identificare il tuo account e la validità della licenza aggiornamenti. "
COM_GPTRANSLATE_EXTENSION_UPDATED_SUCCESS="Estensione aggiornata con successo, la licenza aggiornamenti è valida fino al: %s"
COM_GPTRANSLATE_LICENSE_EXPIRED="La licenza aggiornamenti è scaduta il:% s"
COM_GPTRANSLATE_LICENSE_NOMATCHING="L'indirizzo email per gli aggiornamenti che si è specificato non corrisponde ad alcuna licenza valida, controllare che l'indirizzo email sia esattamente quello utilizzato per la registrazione e l'acquisto del prodotto sul sito https://storejextensions.org, in alternativa utilizzare un altro metodo per aggiornare l'estensione."
COM_GPTRANSLATE_ERROR_RETRIEVING_LICENSE_INFO="Errore durante il recupero informazioni di licenza dal server remoto, si prega di utilizzare un metodo alternativo per aggiornare l'estensione."