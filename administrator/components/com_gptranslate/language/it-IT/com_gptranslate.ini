COM_GPTRANSLATE_WORDS_MIN_LENGTH_DESC="Puoi specificare la lunghezza minima di una parola che può essere tradotta. Se riscontri problemi con piccole parti di testo che non dovrebbero essere tradotte, inserisci il numero minimo di caratteri per la lunghezza di una parola da tradurre"
COM_GPTRANSLATE_REQUEST_DELAY="Ritardo tra richieste"
COM_GPTRANSLATE_REQUEST_DELAY_DESC="È possibile abilitare un ritardo tra ogni richiesta effettuata alle API remote. Ciò potrebbe essere necessario se si superano i limiti delle risorse del browser e se si riscontrano parti di testo non completamente tradotte"
