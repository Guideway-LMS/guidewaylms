COM_GPTRANSLATE_REQUEST_DELAY_SLOW="Lento"
COM_GPTRANSLATE_REQUEST_DELAY_VERYSLOW="Molto lento"
COM_GPTRANSLATE_REALTIME_TRANSLATIONS="Usa traduzioni in tempo reale"
COM_GPTRANSLATE_REALTIME_TRANSLATIONS_DESC="Se abilitato, le traduzioni verranno sempre eseguite in tempo reale ignorando quelle salvate nel database. Ciò ti consente di ottenere traduzioni sempre aggiornate se aggiungi testo alle pagine o cambi frequentemente i contenuti. Tieni presente che utilizzare il traduttore in questo modo può portare a maggiori costi di utilizzo per i piani a pagamento di ChatGPT e ad avere le pagine tradotte più lentamente perché vengono eseguite sempre in tempo reale, mentre non ci sono molte differenze utilizzando Google AI"
COM_GPTRANSLATE_IGNORE_QUERYSTRING="Ignora query string"
COM_GPTRANSLATE_IGNORE_QUERYSTRING_DESC="Se abilitato, la query string nell'URL della pagina tradotta sarà ignorata e non verrà trattata come un link separato. Se desideri trattare gli URL come identici indipendentemente dalla query string, attiva questa opzione"
COM_GPTRANSLATE_ENABLE_INDEXER="Abilita indicizzazione Smart Search"
COM_GPTRANSLATE_ENABLE_INDEXER_DESC="Se abilitato, le traduzioni saranno indicizzate dallo Smart Search di Joomla per trovare le pagine tradotte nei risultati di ricerca di Joomla. Per questa funzionalità, è necessario indicizzare gli URL multilingua fisici con GPTranslate e il sistema multilingua di Joomla. Per maggiori informazioni, vedere la documentazione PDF al paragrafo 'Smart Search Indexer'"
COM_GPTRANSLATE_SUBFOLDER_INSTALLATION="Installazione in sotto-cartella"
COM_GPTRANSLATE_SUBFOLDER_INSTALLATION_DESC="Se hai installato Joomla in una sottocartella, potrebbe essere necessario attivare questa opzione per avere gli URL della lingua riscritti correttamente"
COM_GPTRANSLATE_CSS_WRAPPER_ELEMENT="Selettore CSS elemento contenitore"
COM_GPTRANSLATE_CSS_WRAPPER_ELEMENT_DESC="Selettore CSS dell'elemento contenitore in cui verrà visualizzato il widget, impostazione predefinita: .gptranslate_wrapper"
COM_GPTRANSLATE_DRAGGABLE_WIDGET="Widget trascinabile"
COM_GPTRANSLATE_DRAGGABLE_WIDGET_DESC="Se abilitato, sarà possibile trascinare e spostare il widget sullo schermo"
COM_GPTRANSLATE_DISABLE_CONTROL="Disabilita interfaccia"
COM_GPTRANSLATE_DISABLE_CONTROL_DESC="È possibile disabilitare completamente l'interfaccia di GPTranslate, ad esempio se desideri utilizzare il modulo multilingua predefinito di Joomla per cambiare lingua e utilizzare la funzione di traduzione automatica della lingua rilevata"
