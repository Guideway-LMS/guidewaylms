; Config Reader
COM_GPTRANSLATE_ENABLE_READER="Abilita lettore audio"
COM_GPTRANSLATE_ENABLE_READER_DESC="Abilita la funzione di lettore audio. Le lingue supportate per la lettura audio sono: Afrikaans, Albanian, Arabic, Armenian, Bangla, Bosnian, Brazilian Portuguese, Catalan, Chinese, Croatian, Czech, Danish, Dutch, English, Esperanto, French, Finnish, German, Greek, Hindi, Hungarian, Icelandic, Indonesian, Italian, Japanese, Korean, Latvian, Macedonian, Norwegian, Portuguese, Polish, Romanian, Russian, Serbian, Slovak, Spanish, Swedish, Swahili, Tamil, Thai, Turkish, Vietnamese, Welsh"
COM_GPTRANSLATE_RESPONSIVEVOICE_APIKEY="<a href='https://responsivevoice.org/' target='_blank'>Responsive Voice ApiKey</a>"
COM_GPTRANSLATE_RESPONSIVEVOICE_APIKEY_DESC="Per utilizzare il lettore audio Responsive Voice con determinate lingue come greco, arabo, ecc. è necessario specificare una ApiKey. Puoi registrare la tua ApiKey gratuita o a pagamento per il servizio Responsive Voice su https://responsivevoice.org oppure se sufficiente utilizzare quella gratuita inclusa nel plugin"
COM_GPTRANSLATE_RESPONSIVEVOICE_LANGUAGE_GENDER="Genere della lingua"
COM_GPTRANSLATE_RESPONSIVEVOICE_LANGUAGE_GENDER_DESC="Scegli il genere della lingua preferita utilizzata per l'audio Responsive Voice. Se il genere selezionato non è disponibile per una determinata lingua, tornerà automaticamente a quella disponibile"
