COM_GPTRANSLATE_CHATGPT_ORIGINAL_LANGUAGE_DESC="Scegli la lingua originale del testo nella pagina"
COM_GPTRANSLATE_DETECT_CURRENT_LANGUAGE="Rileva lingua corrente"
COM_GPTRANSLATE_DETECT_CURRENT_LANGUAGE_DESC="Rileva automaticamente la lingua della pagina corrente in base al tag 'html' e all'attributo 'lang'. Questa opzione può essere utile se si usa il sistema multilingua di Joomla e si vuole aggiungere GPTranslate"
COM_GPTRANSLATE_DETECT_DEFAULT_LANGUAGE="Rileva lingua originale"
COM_GPTRANSLATE_DETECT_DEFAULT_LANGUAGE_DESC="Rileva automaticamente la lingua della pagina originale in base al tag 'html' e all'attributo 'lang'. Questa opzione sovrascrive la 'Lingua originale' e può essere utile se si usa il sistema multilingua di Joomla e si vuole aggiungere GPTranslate"
COM_GPTRANSLATE_DETECT_BROWSER_LANGUAGE="Rileva lingua del browser"
COM_GPTRANSLATE_DETECT_BROWSER_LANGUAGE_DESC="Seleziona automaticamente la lingua di traduzione in base alla lingua del browser alla prima visita"
COM_GPTRANSLATE_AUTOTRANSLATE_DETECTED_LANGUAGE="Traduci automaticamente lingua rilevata"
COM_GPTRANSLATE_AUTOTRANSLATE_DETECTED_LANGUAGE_DESC="Traduci automaticamente la lingua originale nella lingua rilevata in base al tag 'html' e all'attributo 'lang'. Questa opzione può essere utile se utilizzi il sistema multilingua Joomla e vuoi tradurre automaticamente pagine scritte nella stessa lingua originale visitate con URL diverse per ogni lingua installata"
COM_GPTRANSLATE_ALWAYS_DETECT_AUTOTRANSLATED_LANGUAGE="Rileva sempre la lingua auto-tradotta"
COM_GPTRANSLATE_ALWAYS_DETECT_AUTOTRANSLATED_LANGUAGE_DESC="Questa opzione garantisce che la lingua tradotta automaticamente venga sempre rilevata e aggiornata quando la pagina viene caricata"
COM_GPTRANSLATE_REWRITE_LANGUAGE_URL="Riscrivi URL lingua"
COM_GPTRANSLATE_REWRITE_LANGUAGE_URL_DESC="Le pagine tradotte avranno un URL specifico corrispondente alla lingua tradotta. Questo può essere utile per i visitatori che visualizzeranno URL che identificano la lingua corrente e per i motori di ricerca che potranno indicizzare le pagine in base alla lingua. Per fare in modo che i motori di ricerca indicizzino URL multilingua reali, è necessario installare un pacchetto lingua Joomla per ogni lingua che si desidera tradurre automaticamente con GPTranslate, abilitare il plugin 'Sistema - Filtro lingua' di Joomla e abilitare l'opzione 'Traduci automaticamente lingua rilevata'"
COM_GPTRANSLATE_REWRITE_DEFAULT_LANGUAGE_URL="Riscrivi URL lingua default"
COM_GPTRANSLATE_REWRITE_DEFAULT_LANGUAGE_URL_DESC="Se abilitato, anche la lingua predefinita avrà URL specifici per le pagine non tradotte corrispondenti alla lingua originale che potranno essere indicizzate dai motori di ricerca"
COM_GPTRANSLATE_REWRITE_PAGE_LINKS="Riscrivi link della pagina"
COM_GPTRANSLATE_REWRITE_PAGE_LINKS_DESC="Se abilitato, anche i link interni della pagina saranno riscritti per corrispondere alla lingua tradotta"
COM_GPTRANSLATE_TRANSLATE_METADATA="Traduci metadati"
COM_GPTRANSLATE_TRANSLATE_METADATA_DESC="Se abilitato, verranno tradotti anche tutti i metadati e i placeholders dei form presenti nella pagina. Ciò include: meta title, meta description, tags Open Graph, placeholders dei form, ecc"
COM_GPTRANSLATE_SET_HTML_LANG="Imposta la lingua del 'tag html'"
COM_GPTRANSLATE_SET_HTML_LANG_DESC="Se abilitato, l'attributo 'lang' del tag 'html' principale verrà valorizzato con la lingua scelta per una migliore SEO"
COM_GPTRANSLATE_ADD_CANONICAL="Aggiungi tag canonical"
COM_GPTRANSLATE_ADD_CANONICAL_DESC="Se abilitato, il tag canonical verrà aggiunto in base alla lingua scelta per una migliore SEO"
COM_GPTRANSLATE_ADD_ALTERNATE="Aggiungi tag 'alternate hreflang'"
COM_GPTRANSLATE_ADD_ALTERNATE_DESC="Se abilitato, i tag hreflang verranno aggiunti per tutte le lingue abilitate su ogni pagina. Questo aiuta i motori di ricerca a fornire agli utenti la versione corretta in base alle loro preferenze della lingua"
COM_GPTRANSLATE_DEFAULT_LANGUAGE_FIRST="Lingua originale per prima"
COM_GPTRANSLATE_DEFAULT_LANGUAGE_FIRST_DESC="Se abilitato, la lingua originale selezionata nell'opzione 'Lingua originale', sarà la prima nella lista delle lingue disponibili"
