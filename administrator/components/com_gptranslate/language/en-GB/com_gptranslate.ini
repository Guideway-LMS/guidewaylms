COM_GPTRANSLATE_CHATGPT_TRANSLATION_ENGINE="Translation engine"
COM_GPTRANSLATE_CHATGPT_TRANSLATION_ENGINE_DESC="Choose the preferred translation engine between ChatGPT and Google AI. ChatGPT requires a paid plan, Google AI is free to use"
COM_GPTRANSLATE_CHATGPT_TRANSLATION_ENGINE_CHATGPT="ChatGPT"
COM_GPTRANSLATE_CHATGPT_TRANSLATION_ENGINE_GTRANSLATE="Google AI"
COM_GPTRANSLATE_CHATGPT_APIKEY="<a href='https://platform.openai.com/account/api-keys' target='_blank'>ChatGPT ApiKey</a>"
COM_GPTRANSLATE_CHATGPT_APIKEY_DESC="Enter the ApiKey that you have registered in your ChatGPT account at: https://platform.openai.com/account/api-keys"
COM_GPTRANSLATE_CHATGPT_APIKEY_HINT="Enter the ApiKey in the format: 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"
COM_GPTRANSLATE_CHATGPT_MODEL="ChatGPT model"
COM_GPTRANSLATE_CHATGPT_MODEL_DESC="Choose the preferred model of ChatGPT"
COM_GPTRANSLATE_CHATGPT_REQUEST_MESSAGE="Request message to ChatGPT"
COM_GPTRANSLATE_CHATGPT_REQUEST_MESSAGE_DESC="Enter a request message to ChatGPT to send a JSON object with the original texts and receive a JSON object with the translations. If you notice errors or untranslated text on your pages, you may need to adjust the text of the ChatGPT request message to help the AI understand more correctly. Alternatively use Google AI as a translation engine"
COM_GPTRANSLATE_CHATGPT_REQUEST_CONVERSATION_MODE="Request conversation role"
COM_GPTRANSLATE_CHATGPT_REQUEST_CONVERSATION_MODE_DESC="Choose the conversation role for the ChatGPT request, being 'system' or 'user' request"
COM_GPTRANSLATE_CHATGPT_REQUEST_CONVERSATION_MODE_SYSTEM="System"
COM_GPTRANSLATE_CHATGPT_REQUEST_CONVERSATION_MODE_USER="User"
COM_GPTRANSLATE_MAX_NUMBER_TRANSLATIONS_PER_REQUEST="Max number of translations per request"
COM_GPTRANSLATE_MAX_NUMBER_TRANSLATIONS_PER_REQUEST_DESC="Enter the maximum number of translations sent to ChatGPT for each request. It is necessary to be careful not to exceed the limits of the tokens available for the request and response of the ChatGPT API"
COM_GPTRANSLATE_MAX_NUMBER_CHARACTERS_PER_REQUEST="Maximum number of characters per request"
COM_GPTRANSLATE_MAX_NUMBER_CHARACTERS_PER_REQUEST_DESC="Enter the maximum number of characters sent to ChatGPT per request. It is necessary to be careful not to exceed the limits of the tokens available for the request and response of the ChatGPT API"
COM_GPTRANSLATE_CHATGPT_ORIGINAL_LANGUAGE="Original language"
COM_GPTRANSLATE_CHATGPT_ORIGINAL_LANGUAGE_DESC="Choose the original language of the text on the page"
COM_GPTRANSLATE_DETECT_CURRENT_LANGUAGE="Detect current language"
COM_GPTRANSLATE_DETECT_CURRENT_LANGUAGE_DESC="Automatically select the current page language based on the 'html' tag and 'lang' attribute. This option can be useful if you use the Joomla multilanguage system and you want to add GPTranslate to it"
COM_GPTRANSLATE_DETECT_DEFAULT_LANGUAGE="Detect original language"
COM_GPTRANSLATE_DETECT_DEFAULT_LANGUAGE_DESC="Automatically select the original page language based on the 'html' tag and 'lang' attribute. This option overrides the 'Original language' and can be useful if you use the Joomla multilanguage system and you want to add GPTranslate to it"
COM_GPTRANSLATE_DETECT_BROWSER_LANGUAGE="Detect browser language"
COM_GPTRANSLATE_DETECT_BROWSER_LANGUAGE_DESC="Automatically select the translation language based on your browser language on your first visit"
COM_GPTRANSLATE_AUTOTRANSLATE_DETECTED_LANGUAGE="Auto-translate detected language"
COM_GPTRANSLATE_AUTOTRANSLATE_DETECTED_LANGUAGE_DESC="Automatically translate the original language into the detected language based on the 'html' tag and 'lang' attribute. This option can be useful if you use the Joomla multilanguage system and want to automatically translate pages written in the same original language visited with different URLs for each installed language"
COM_GPTRANSLATE_ALWAYS_DETECT_AUTOTRANSLATED_LANGUAGE="Always detect auto-translated language"
COM_GPTRANSLATE_ALWAYS_DETECT_AUTOTRANSLATED_LANGUAGE_DESC="This option ensures that the auto-translated language is always detected and updated when the page loads"
COM_GPTRANSLATE_REWRITE_LANGUAGE_URL="Rewrite language URL"
COM_GPTRANSLATE_REWRITE_LANGUAGE_URL_DESC="The translated pages will have a specific URL corresponding to the translated language. This can be useful for visitors who have URLs that identify the current language and for search engines that can index pages by language. To make search engines index real multilanguage URLs, you need to install a Joomla language pack for each language you want to automatically translate with GPTranslate, enable the Joomla 'System - Language Filter' plugin and enable the 'Auto-translate detected language' option"
COM_GPTRANSLATE_REWRITE_DEFAULT_LANGUAGE_URL="Rewrite default language URL"
COM_GPTRANSLATE_REWRITE_DEFAULT_LANGUAGE_URL_DESC="If enabled, the default language will also have specific URLs for untranslated pages corresponding to the original language which can be indexed by search engines"
COM_GPTRANSLATE_REWRITE_PAGE_LINKS="Rewrite page links"
COM_GPTRANSLATE_REWRITE_PAGE_LINKS_DESC="If enabled, internal page links will also be rewritten to match the translated language"
COM_GPTRANSLATE_TRANSLATE_METADATA="Translate metadata"
COM_GPTRANSLATE_TRANSLATE_METADATA_DESC="If enabled, all metadata and form placeholders found on the page will also be translated. This includes: meta title, meta description, Open Graph tags, form placeholders, etc"
COM_GPTRANSLATE_SET_HTML_LANG="Set 'html tag' language"
COM_GPTRANSLATE_SET_HTML_LANG_DESC="If enabled, the 'lang' attribute of the main 'html' tag will be set to the chosen language for better SEO"
COM_GPTRANSLATE_ADD_CANONICAL="Add canonical tag"
COM_GPTRANSLATE_ADD_CANONICAL_DESC="If enabled, the canonical tag will be added accordingly to the chosen language for better SEO"
COM_GPTRANSLATE_ADD_ALTERNATE="Add 'alternate hreflang' tags"
COM_GPTRANSLATE_ADD_ALTERNATE_DESC="If enabled, hreflang tags will be added for all enabled languages on each page. This helps search engines serve the correct language version to users based on their language preferences"
COM_GPTRANSLATE_DEFAULT_LANGUAGE_FIRST="Original language first"
COM_GPTRANSLATE_DEFAULT_LANGUAGE_FIRST_DESC="If enabled, the original language chosen in the option 'Original language', will be the first one in the list of available languages"
COM_GPTRANSLATE_ALT_FLAGS="Alternative flags"
COM_GPTRANSLATE_ALT_FLAGS_DESC="You can select an alternative version of the flags for some languages"
