COM_GPTRANSLATE_ENABLED_LANGUAGES_DESC="Choose enabled languages for content translations"
COM_GPTRANSLATE_CSS_SELECTOR_LEAFNODES_EXCLUDED="CSS selector for elements to exclude"
COM_GPTRANSLATE_CSS_SELECTOR_LEAFNODES_EXCLUDED_DESC="You can specify CSS selectors for HTML elements that will be excluded from the translation. It's possible to enter CSS selectors separated by commas or one for each line"
COM_GPTRANSLATE_WORDS_LEAFNODES_EXCLUDED="Words for elements to exclude"
COM_GPTRANSLATE_WORDS_LEAFNODES_EXCLUDED_DESC="You can specify a comma separated list of words for elements that will be excluded from the translation"
COM_GPTRANSLATE_WORDS_LEAFNODES_EXCLUDED_BYLANGUAGE_REPEATABLE="Words for elements to exclude by language"
COM_GPTRANSLATE_WORDS_LEAFNODES_EXCLUDED_BYLANGUAGE_REPEATABLE_DESC="You can specify a specific comma separated list of words for elements that will be excluded from the translation both for original and translated language"
COM_GPTRANSLATE_WORDS_MIN_LENGTH="Min word length"
COM_GPTRANSLATE_WORDS_MIN_LENGTH_DESC="You can specify the minimum length of a word that can be translated. If you encounter problems with small parts of text that should not be translated, enter the minimum number of characters for the length of a word to be translated"
COM_GPTRANSLATE_REQUEST_DELAY="Delay between requests"
COM_GPTRANSLATE_REQUEST_DELAY_DESC="It's possible to enable a delay between each request done to the remote APIs. This could be needed if you exceed the limits of browser resources and if you experience parts of text not fully translated"
COM_GPTRANSLATE_REQUEST_NODELAY="No delay"
COM_GPTRANSLATE_REQUEST_DELAY_VERYFAST="Very fast"
COM_GPTRANSLATE_REQUEST_DELAY_MEDIUM="Medium"
COM_GPTRANSLATE_REQUEST_DELAY_FAST="Fast"
COM_GPTRANSLATE_REQUEST_DELAY_SLOW="Slow"
COM_GPTRANSLATE_REQUEST_DELAY_VERYSLOW="Very slow"
COM_GPTRANSLATE_REALTIME_TRANSLATIONS="Use realtime translations"
COM_GPTRANSLATE_REALTIME_TRANSLATIONS_DESC="If enabled, translations will always be performed in realtime ignoring those saved in the database. This allows you to always get updated translations if you add text to pages or change contents frequently. Keep in mind that using the translator in this way can lead to increased usage costs for ChatGPT's paid plans and to having pages translated more slowly because they are always performed in realtime, while this does not make a big difference for Google AI"
COM_GPTRANSLATE_IGNORE_QUERYSTRING="Ignore query string"
COM_GPTRANSLATE_IGNORE_QUERYSTRING_DESC="When enabled, the query string in the translated page URL will be ignored and not treated as a separate link. If you want to treat URLs as identical regardless of the query string, activate this option."
COM_GPTRANSLATE_ENABLE_INDEXER="Enable Smart Search indexing"
COM_GPTRANSLATE_ENABLE_INDEXER_DESC="If enabled, translations will be indexed by the Joomla Smart Search to find translated pages in Joomla search results. In order to have this feature working, it's needed to index all physical multilanguage URLs with GPTranslate and the Joomla multilanguage. For more informations see PDF docs at the paragraph 'Smart Search Indexer'"
COM_GPTRANSLATE_SUBFOLDER_INSTALLATION="Sub-folder installation"
COM_GPTRANSLATE_SUBFOLDER_INSTALLATION_DESC="If you have installed Joomla in a subfolder, you may need to enable this option to have the language URLs rewritten correctly"
COM_GPTRANSLATE_CSS_WRAPPER_ELEMENT="CSS selector of the wrapper element"
COM_GPTRANSLATE_CSS_WRAPPER_ELEMENT_DESC="CSS selector of the wrapper element where the widget will be rendered, default: .gptranslate_wrapper"
COM_GPTRANSLATE_DRAGGABLE_WIDGET="Draggable widget"
COM_GPTRANSLATE_DRAGGABLE_WIDGET_DESC="If enabled, it will be possible to drag and move the widget on the screen"
COM_GPTRANSLATE_DISABLE_CONTROL="Disable interface"
COM_GPTRANSLATE_DISABLE_CONTROL_DESC="It's possible to totally disable the interface of GPTranslate for example if you want to use the default Joomla language module to switch languages and use the auto-translate detected language feature"
COM_GPTRANSLATE_CUSTOM_CSS="Custom CSS"
COM_GPTRANSLATE_CUSTOM_CSS_DESC="Enter custom CSS code"
