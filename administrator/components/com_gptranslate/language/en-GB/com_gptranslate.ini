; Config Reader
COM_GPTRANSLATE_ENABLE_READER="Enable reader"
COM_GPTRANSLATE_ENABLE_READER_DESC="Enable the audio reader feature. The supported languages for audio reading are: Afrikaans, Albanian, Arabic, Armenian, Bangla, Bosnian, Brazilian Portuguese, Catalan, Chinese, Croatian, Czech, Danish, Dutch, English, Esperanto, French, Finnish, German, Greek, Hindi, Hungarian, Icelandic, Indonesian, Italian, Japanese, Korean, Latvian, Macedonian, Norwegian, Portuguese, Polish, Romanian, Russian, Serbian, Slovak, Spanish, Swedish, Swahili, Tamil, Thai, Turkish, Vietnamese, Welsh"
COM_GPTRANSLATE_RESPONSIVEVOICE_APIKEY="<a href='https://responsivevoice.org/' target='_blank'>Responsive Voice ApiKey</a>"
COM_GPTRANSLATE_RESPONSIVEVOICE_APIKEY_DESC="To use the Responsive Voice audio engine with certain languages such as Greek, Arabian, etc you need to specify an ApiKey. You can register your own free or paid ApiKey for the Responsive Voice service at https://responsivevoice.org or if sufficient use the free one included in the plugin"
COM_GPTRANSLATE_RESPONSIVEVOICE_LANGUAGE_GENDER="Responsive Voice language gender"
COM_GPTRANSLATE_RESPONSIVEVOICE_LANGUAGE_GENDER_DESC="Choose the preferred language gender used for the Responsive Voice audio. If the selected gender is not available for a certain language, it will fallback automatically to the available one"
COM_GPTRANSLATE_RESPONSIVEVOICE_LANGUAGE_GENDER_AUTO="Auto"
COM_GPTRANSLATE_RESPONSIVEVOICE_LANGUAGE_GENDER_MALE="Male"
COM_GPTRANSLATE_RESPONSIVEVOICE_LANGUAGE_GENDER_FEMALE="Female"
COM_GPTRANSLATE_MAINPAGE_SELECTOR="CSS selector for the main text of the page"
COM_GPTRANSLATE_MAINPAGE_SELECTOR_DESC="You can specify a CSS selector for the page's HTML elements to identify and read the main text"
COM_GPTRANSLATE_ELEMENTS_TOEXCLUDE_CUSTOM="CSS Selector for elements to exclude"
COM_GPTRANSLATE_ELEMENTS_TOEXCLUDE_CUSTOM_DESC="You can specify a CSS selector for HTML elements that will be excluded from the reading"
COM_GPTRANSLATE_VOLUME="Volume"
COM_GPTRANSLATE_VOLUME_DESC="Choose the default volume of text reading"
COM_GPTRANSLATE_RESPONSIVEVOICE_VOICE_SPEED="Reading speed"
COM_GPTRANSLATE_RESPONSIVEVOICE_VOICE_SPEED_DESC="Set the speed rate of the audio reading"
COM_GPTRANSLATE_VOICE_SPEED_VERYSLOW="Very slow"
COM_GPTRANSLATE_VOICE_SPEED_SLOW="Slow"
COM_GPTRANSLATE_VOICE_SPEED_NORMAL="Normal"
COM_GPTRANSLATE_VOICE_SPEED_FAST="Fast"
COM_GPTRANSLATE_VOICE_SPEED_VERYFAST="Very fast"
COM_GPTRANSLATE_VOICE_SPEED_EXTREMELYFAST="Extremely fast"
COM_GPTRANSLATE_RESPONSIVE_LOADING_SCRIPT="Responsive Voice script loading"
COM_GPTRANSLATE_RESPONSIVE_LOADING_SCRIPT_DESC="You can choose to load the Responsive Voice script from your local server or from the official remote server https://responsivevoice.org"
COM_GPTRANSLATE_RESPONSIVE_LOADING_SCRIPT_LOCAL="Local script"
COM_GPTRANSLATE_RESPONSIVE_LOADING_SCRIPT_REMOTE="Remote script"
COM_GPTRANSLATE_CHUNKSIZE="Max chunk length"
COM_GPTRANSLATE_CHUNKSIZE_DESC="This is the buffer size for characters and applies to local script loading only. Change this value only if you experience performance problems or if the reading stops playing at a random text point, as it indicates the maximum length of the chunk of text to be converted into audio"

; Appearance
COM_GPTRANSLATE_WIDGET_TEXT_COLOR="Text color"
COM_GPTRANSLATE_WIDGET_TEXT_COLOR_DESC="Choose the color of the text of the widget"
COM_GPTRANSLATE_WIDGET_BACKGROUND_COLOR="Background color"
COM_GPTRANSLATE_WIDGET_BACKGROUND_COLOR_DESC="Choose the color of the background of the widget"
COM_GPTRANSLATE_WIDGET_BORDER_RADIUS="Border radius"
COM_GPTRANSLATE_WIDGET_BORDER_RADIUS_DESC="Choose an optional border radius for the widget"
COM_GPTRANSLATE_WIDGET_POPUP_FONTSIZE="Font size"
COM_GPTRANSLATE_WIDGET_POPUP_FONTSIZE_DESC="Choose the preferred font size for the text of the widget. This option calculates also the padding between flags and can be useful to manage the padding amount for flags displayed without the language name and dropdown"
COM_GPTRANSLATE_WIDGET_POPUP_ICONSIZE="Icon size"
COM_GPTRANSLATE_WIDGET_POPUP_ICONSIZE_DESC="Choose the preferred icon size for both flags and play buttons"
COM_GPTRANSLATE_FLAG_STYLE="Flag style"
COM_GPTRANSLATE_FLAG_STYLE_DESC="Choose the preferred flag style"
COM_GPTRANSLATE_FLAG_STYLE_2D="Flat style"
COM_GPTRANSLATE_FLAG_STYLE_3D="Embossed style"
COM_GPTRANSLATE_FLAG_LOCATION="Flag path"
COM_GPTRANSLATE_FLAG_LOCATION_DESC="Choose the path for language flags, local or remote CDN"
COM_GPTRANSLATE_FLAG_LOCAL="Local"
COM_GPTRANSLATE_FLAG_CDN="Remote CDN"
COM_GPTRANSLATE_SHOW_LANGUAGE_TITLES="Show language titles"
COM_GPTRANSLATE_SHOW_LANGUAGE_TITLES_DESC="Choose to show the language titles or flags only"
COM_GPTRANSLATE_ENABLE_DROPDOWN="Enable dropdown"
COM_GPTRANSLATE_ENABLE_DROPDOWN_DESC="The list of available languages will be displayed using a dropdown. If you choose to display the languages inline within a module instead than using a floating widget, you may need to disable this option"
COM_GPTRANSLATE_EQUAL_WIDTHS="Equal widths"
COM_GPTRANSLATE_EQUAL_WIDTHS_DESC="When the list of available languages is not displayed using a floating widget, it's possible to choose to display each language flag and title with the same width"
COM_GPTRANSLATE_READER_BUTTON_POSITION="Reader button position"
COM_GPTRANSLATE_READER_BUTTON_POSITION_DESC="If the language dropdown is disabled, it's possible to choose to display the reader button at the top or at the bottom of the widget"
COM_GPTRANSLATE_READER_BUTTON_POSITION_TOP="Top"
COM_GPTRANSLATE_READER_BUTTON_POSITION_BOTTOM="Bottom"
COM_GPTRANSLATE_WIDGET_MAX_HEIGHT="Max height of the widget"
COM_GPTRANSLATE_WIDGET_MAX_HEIGHT_DESC="Enter the max height of the widget in px. If the height is exceeded, a scrollbar will be displayed when the widget is open"

; Joomla Updater
COM_GPTRANSLATE_AUTO_UPDATER="Auto updater"
COM_GPTRANSLATE_REGISTRATION_EMAIL_FORUPDATES="Registration email address for updater"
COM_GPTRANSLATE_REGISTRATION_EMAIL_FORUPDATES_DESC="Enter the exact email address used to register on our site https://storejextensions.org. The email address is used to identify your account and the validity of the updates license. Free updates are included for 1 year from the date of the latest purchase. More info about licensing and updates at our FAQ page https://storejextensions.org/faq.html"
COM_GPTRANSLATE_UPDATER_STANDARD_ADVISE="Our commercial extension requires a valid license to be updated using the Joomla! updater or manually downloading and installing the latest package through the Joomla! Extensions Manager. To download this new release you need a valid updates license, the license for free updates is valid for 1 year from the date of the purchase. If your license is expired, you can simply buy again this product to download this latest release and extend free updates for 1 additional year. Visit our store at <a target='_blank' href='https://storejextensions.org'>https://storejextensions.org</a> and after login check your 'Purchased products' reserved area. More info at the FAQ page: <a target='_blank' href='https://storejextensions.org/faq.html'>https://storejextensions.org/faq.html</a>"
COM_GPTRANSLATE_MISSING_REGISTRATION_EMAIL_ADDRESS="Missing registration email address for the updater. Please specify in the <a href='%s'>component configuration parameter</a>, the exact email address used to register your account on our site <a target='_blank' href='https://storejextensions.org'></a>. The email address is used to identify your account and the validity of the updates license."
COM_GPTRANSLATE_EXTENSION_UPDATED_SUCCESS="Extension updated successfully, your updates license is valid until: %s"
COM_GPTRANSLATE_LICENSE_EXPIRED="Your updates license is expired on: %s"
COM_GPTRANSLATE_LICENSE_NOMATCHING="The registration email address for the updater that you specified does not match any valid license, please check it or use an alternative method to update the extension."
COM_GPTRANSLATE_ERROR_RETRIEVING_LICENSE_INFO="Error retrieving license informations from the remote server, please use an alternative method to update the extension."